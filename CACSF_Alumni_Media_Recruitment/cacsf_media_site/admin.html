<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Unit Admin</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/logoextension.png" alt="" onerror="this.style.display='none'"><span>CACSF <small>MEDIA ADMIN</small></span></a><a class="top-link" href="index.html">← Application</a></header><main class="admin-wrap"><section class="admin-hero"><div class="eyebrow"><span class="dot"></span> ADMIN DASHBOARD</div><h1>Applicants <em>overview.</em></h1><p>Review, search and export volunteer applications.</p></section><section id="login" class="login-card"><h2>Admin access</h2><p>Sign in with an authorised Supabase admin account.</p><label>Email<input id="email" type="email" placeholder="Admin email"></label><label>Password<input id="password" type="password" placeholder="Password"></label><button id="loginBtn" class="submit">Sign in</button><p id="loginHint" class="hint"></p></section><section id="dashboard" hidden><div class="dash-toolbar"><div class="stats"><div class="stat"><small>Applicants</small><strong id="count">0</strong></div><div class="stat"><small>Skills represented</small><strong id="skillCount">0</strong></div></div><div class="actions"><button id="export" class="outline">Export CSV ↓</button><button id="logout" class="outline">Sign out</button></div></div><input id="search" class="search" placeholder="Search name, set, email or skill…"><div id="applicants" class="applicant-list"></div></section><footer>© CACSF Alumni Fellowship Media Unit</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
